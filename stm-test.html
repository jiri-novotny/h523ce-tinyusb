<!DOCTYPE html>
<html>

<head>
  <title>STM32 Test</title>
  <meta charset="utf-8">
  <link rel="icon" href="https://icons.getbootstrap.com/assets/icons/lightbulb.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" rel="stylesheet" />
  <style>
    .slidecontainer {
      width: 50%; /* Width of the outside container */
    }

    /* The slider itself */
    .slider {
      -webkit-appearance: none;  /* Override default CSS styles */
      appearance: none;
      width: 100%; /* Full-width */
      height: 25px; /* Specified height */
      background: #d3d3d3; /* Grey background */
      outline: none; /* Remove outline */
      opacity: 0.7; /* Set transparency (for mouse-over effects on hover) */
      -webkit-transition: .2s; /* 0.2 seconds transition on hover */
      transition: opacity .2s;
    }

    /* Mouse-over effects */
    .slider:hover {
      opacity: 1; /* Fully shown on mouse-over */
    }

    /* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) and -moz- (Firefox) to override default look) */
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; /* Override default look */
      appearance: none;
      width: 25px; /* Set a specific slider handle width */
      height: 25px; /* Slider handle height */
      background: #CCCCCC; /* Green background */
      cursor: pointer; /* Cursor on hover */
    }

    .slider::-moz-range-thumb {
      width: 25px; /* Set a specific slider handle width */
      height: 25px; /* Slider handle height */
      background: #CCCCCC; /* Green background */
      cursor: pointer; /* Cursor on hover */
    }

    .window {
      position: absolute;
      top: 100px;
      left: 100px;
      width: 1000px;
      background-color: #f0f0f0;
      border: 1px solid #707070;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      user-select: none; /* Prevents text selection while dragging */
      display: none;
    }

    .window-header {
      background: linear-gradient(180deg, #e1e1e1, #cccccc);
      padding: 4px 8px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #b0b0b0;
    }

    .window-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .close-btn {
      background: #ff5f56;
      border: 1px solid #e0443e;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      line-height: 14px;
      text-align: center;
      font-size: 14px;
      padding-left: 3px;
      color: #fff;
      cursor: pointer;
    }

    .window-body {
      padding: 8px;
      background-color: #ffffff;
      color: #222;
    }
  </style>
</head>

<body onload="tryConnect();">
  <div id="hid-state">Disconnected</div>
  <br />
  <input type="button" id="btn-connect-device" value="connect" />
  <input type="button" id="btn-disconnect-device" value="disconnect" disabled />
  <input type="button" id="btn-btl" value="JumpBtl" disabled />
  <br />
  <input type="button" id="btn-temperature" value="Temperature" disabled />
  <input type="button" id="btn-terminal" value="Terminal" disabled />
  <br />
  <br />
  Flash:
  size <input type="number" id="fs-size" value="65536" min="1" step="1024" style="width: 8em" /> B,
  chunk <input type="number" id="fs-chunk" value="256" min="1" max="4096" style="width: 5em" /> B
  <br />
  <input type="button" id="btn-fs-info" value="Info" disabled />
  <input type="button" id="btn-fs-bench" value="Device bench" disabled />
  <input type="button" id="btn-fs-write" value="USB write" disabled />
  <input type="button" id="btn-fs-read" value="USB read" disabled />
  <pre id="fs-log" style="max-height: 20em; overflow-y: auto;"></pre>
  <br />
  Response:
  <br />
  <div id="hid-resp">&nbsp;</div>
  <br />
  <div id="desktop-window" class="window">
    <div id="window-header" class="window-header">
      <span class="window-title">Terminal</span>
      <button id="close-btn" class="close-btn">&times;</button>
    </div>
    <div class="window-body">
      <div id="terminal"></div>
    </div>
  </div>
</body>
<script>
  const HDR_NULL    = 0;
  const HDR_JUMP_TO = 1;
  const HDR_TEMP    = 2;
  const HDR_BTN     = 3;
  const HDR_UART    = 4;
  const HDR_MODEM   = 5;
  const HDR_FS_OPEN  = 6;
  const HDR_FS_WRITE = 7;
  const HDR_FS_READ  = 8;
  const HDR_FS_CLOSE = 9;
  const HDR_FS_BENCH = 10;
  const HDR_FS_INFO  = 11;

  let state = document.getElementById("hid-state");
  let response = document.getElementById("hid-resp");
  let connectButton = document.getElementById("btn-connect-device");
  let disconnectButton = document.getElementById("btn-disconnect-device");

  let tempButton = document.getElementById("btn-temperature");
  let termButton = document.getElementById("btn-terminal");
  let btlButton = document.getElementById("btn-btl");

  let fsSize = document.getElementById("fs-size");
  let fsChunk = document.getElementById("fs-chunk");
  let fsLog = document.getElementById("fs-log");
  let fsInfoButton = document.getElementById("btn-fs-info");
  let fsBenchButton = document.getElementById("btn-fs-bench");
  let fsWriteButton = document.getElementById("btn-fs-write");
  let fsReadButton = document.getElementById("btn-fs-read");

  const term = new Terminal({convertEol:true});
  let cmd = "";

  let device;

  async function sendPacket(pkt) {
    if (!device) return;

    let data = new Uint8Array(64);
    data.set(pkt, 0);
    try {
      await device.sendReport(0x00, data);
    } catch (error) {
      console.log("An error occurred:" + error);
    }
  }

  async function tryConnect() {
    try {
      [device] = await navigator.hid.getDevices();
      if (!device) return;
      device.open().then(handleOnOpen);
    } catch (error) {
      console.log("An error occurred:" + error);
    }
  }

  function handleOnOpen() {
    state.innerText = "Connected"
    response.innerText = "-";
    connectButton.disabled = true;
    disconnectButton.disabled = false;
    lockUi(false);
    device.addEventListener("inputreport", handleInputReport);
  }

  function handleConnectedDevice(e) {
    device = e.device;
    device.open().then(handleOnOpen);
  }

  function handleDisconnectedDevice(e) {
    device.close();
    state.innerText = "Disconnected";
    response.innerText = "-";
    connectButton.disabled = false;
    disconnectButton.disabled = true;
    lockUi(true);
  }

  function handleInputReport(e) {
    const { data, device, reportId } = e;
    packetParser(data);
  }

  connectButton.addEventListener("click", async () => {
    try {
      [device] = await navigator.hid.requestDevice({
        filters: [{
          vendorId: 0xCafe,
          productId: 0x8008,
        }]
      });
      if (!device) return;
      device.open().then(handleOnOpen);
    } catch (error) {
      console.log("An error occurred:" + error);
    }
  });

  disconnectButton.addEventListener("click", async () => {
    handleDisconnectedDevice(null);
  });

  tempButton.addEventListener("click", async () => {
    sendPacket([HDR_TEMP, 0x00]);
  });

  termButton.addEventListener("click", async () => {
    windowElement.style.display = "block";
    termButton.disabled = true;
  });

  btlButton.addEventListener("click", async () => {
    sendPacket([HDR_JUMP_TO, 0x01, 0x02]);
  });

  function sendCommand(cmd) {
    if (cmd.length > 0)
    {
      cmd += "\r\n";
      let sendCmd = new Uint8Array(cmd.length + 2);
      sendCmd[0] = HDR_UART;
      sendCmd[1] = cmd.length;
      sendCmd.set(new TextEncoder().encode(cmd), 2);
      sendPacket(sendCmd);
      term.write(cmd);
    }
  }

  function lockUi(state) {
    fsInfoButton.disabled = state;
    fsBenchButton.disabled = state;
    fsWriteButton.disabled = state;
    fsReadButton.disabled = state;
    tempButton.disabled = state;
    termButton.disabled = state;
    btlButton.disabled = state;
  }

  async function packetParser(data)
  {
    const hdr = data.getUint8(0);
    const pktLen = data.getUint8(1);
    switch (hdr)
    {
      case HDR_NULL:
        break;

      case HDR_TEMP:
        response.innerText = "Temp: " + data.getInt16(2, true);
        console.log(buf2hex(data.buffer.slice(0, pktLen + 2)));
        break;

      case HDR_BTN:
        response.innerText = "Button: " + data.getUint8(2);
        break;

      case HDR_UART:
        term.write(new TextDecoder().decode(data.buffer.slice(2, pktLen + 2)));
        console.log(buf2hex(data.buffer.slice(0, pktLen + 2)));
        break;

      case HDR_FS_READ:
        if (fsReadSink) fsReadSink(new Uint8Array(data.buffer, 2, pktLen));
        break;

      case HDR_FS_OPEN:
      case HDR_FS_CLOSE:
      case HDR_FS_BENCH:
      case HDR_FS_INFO:
        if (fsWaiters[hdr]) fsWaiters[hdr](data);
        break;

      case HDR_MODEM:
        response.innerText = ("Modem is " + ((data.getUint8(2) == 0) ? "off" : "on"));
        console.log(buf2hex(data.buffer.slice(0, pktLen + 2)));
        break;

      default:
        console.log(buf2hex(data.buffer.slice(0, pktLen + 2)));
        break;
    }
  }

  /* ---------------- flash benchmark ---------------- */
  const FS_FILE = "usb.bin";
  const FS_PKT_DATA = 62;
  let fsWaiters = {};
  let fsReadSink = null;
  let fsUsbData = null; // last data written over USB, used to verify read

  function fsPrint(line) {
    fsLog.textContent += line + "\n";
    fsLog.scrollTop = fsLog.scrollHeight;
  }

  function fsRate(bytes, ms) {
    return ms > 0 ? (bytes / 1024 / (ms / 1000)).toFixed(1) + " KiB/s" : "-";
  }

  function fsWaitReply(hdr, timeoutMs) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        delete fsWaiters[hdr];
        reject(new Error("timeout waiting for reply " + hdr));
      }, timeoutMs);
      fsWaiters[hdr] = (data) => {
        clearTimeout(timer);
        delete fsWaiters[hdr];
        resolve(data);
      };
    });
  }

  async function fsRequest(pkt, hdr, timeoutMs) {
    const reply = fsWaitReply(hdr, timeoutMs);
    await sendPacket(pkt);
    const data = await reply;
    const status = data.getInt8(2);
    if (status != 0) throw new Error("device error " + status);
    return data;
  }

  async function fsOpen(name, write) {
    const nameBytes = new TextEncoder().encode(name);
    const pkt = new Uint8Array(3 + nameBytes.length);
    pkt[0] = HDR_FS_OPEN;
    pkt[1] = 1 + nameBytes.length;
    pkt[2] = write ? 1 : 0;
    pkt.set(nameBytes, 3);
    const data = await fsRequest(pkt, HDR_FS_OPEN, 5000);
    return data.getUint32(3, true);
  }

  async function fsClose(timeoutMs) {
    const data = await fsRequest([HDR_FS_CLOSE, 0], HDR_FS_CLOSE, timeoutMs);
    return data.getUint32(3, true);
  }

  async function fsRun(fn) {
    lockUi(true);
    try {
      await fn();
    } catch (error) {
      fsPrint("  FAILED: " + error.message);
    }
    lockUi(!connectButton.disabled);
  }

  fsInfoButton.addEventListener("click", () => fsRun(async () => {
    const data = await fsRequest([HDR_FS_INFO, 0], HDR_FS_INFO, 5000);
    const jedec = data.getUint32(3, true);
    const blockSize = data.getUint32(7, true);
    const blockCount = data.getUint32(11, true);
    const used = data.getUint32(15, true);
    fsPrint("Info: JEDEC " + jedec.toString(16).padStart(6, "0") +
            ", " + (blockSize * blockCount / 1024 / 1024) + " MiB" +
            ", block " + blockSize + " B" +
            ", used " + used + "/" + blockCount + " blocks");
  }));

  fsBenchButton.addEventListener("click", () => fsRun(async () => {
    const size = parseInt(fsSize.value);
    const chunk = parseInt(fsChunk.value);
    fsPrint("Device bench: " + size + " B, chunk " + chunk + " B ...");
    const pkt = new Uint8Array(8);
    const view = new DataView(pkt.buffer);
    pkt[0] = HDR_FS_BENCH;
    pkt[1] = 6;
    view.setUint32(2, size, true);
    view.setUint16(6, chunk, true);
    // flash write is roughly tens of KiB/s, be generous
    const data = await fsRequest(pkt, HDR_FS_BENCH, 30000 + size / 5);
    const writeMs = data.getUint32(3, true);
    const readMs = data.getUint32(7, true);
    const errors = data.getUint32(11, true);
    fsPrint("  write " + writeMs + " ms (" + fsRate(size, writeMs) + ")" +
            ", read " + readMs + " ms (" + fsRate(size, readMs) + ")" +
            ", verify " + (errors == 0 ? "OK" : errors + " bad bytes"));
  }));

  fsWriteButton.addEventListener("click", () => fsRun(async () => {
    const size = parseInt(fsSize.value);
    fsUsbData = new Uint8Array(size);
    for (let off = 0; off < size; off += 65536) {
      crypto.getRandomValues(fsUsbData.subarray(off, Math.min(off + 65536, size)));
    }
    fsPrint("USB write: " + size + " B to " + FS_FILE + " ...");

    const t0 = performance.now();
    await fsOpen(FS_FILE, true);
    const pkt = new Uint8Array(2 + FS_PKT_DATA);
    pkt[0] = HDR_FS_WRITE;
    for (let off = 0; off < size; off += FS_PKT_DATA) {
      const n = Math.min(FS_PKT_DATA, size - off);
      pkt[1] = n;
      pkt.set(fsUsbData.subarray(off, off + n), 2);
      await sendPacket(pkt.subarray(0, 2 + n));
    }
    const bytes = await fsClose(10000);
    const ms = performance.now() - t0;
    fsPrint("  " + bytes + " B in " + ms.toFixed(0) + " ms (" + fsRate(bytes, ms) + ")" +
            (bytes != size ? " - SIZE MISMATCH" : ""));
  }));

  fsReadButton.addEventListener("click", () => fsRun(async () => {
    fsPrint("USB read: " + FS_FILE + " ...");
    const t0 = performance.now();
    const size = await fsOpen(FS_FILE, false);
    const buf = new Uint8Array(size);
    let got = 0;
    const done = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("read timeout at " + got + " B")), 10000 + size / 2);
      fsReadSink = (chunk) => {
        if (chunk.length == 0 || got + chunk.length > size) {
          clearTimeout(timer);
          resolve();
          return;
        }
        buf.set(chunk, got);
        got += chunk.length;
      };
    });
    try {
      await sendPacket([HDR_FS_READ, 0]);
      await done;
    } finally {
      fsReadSink = null;
    }
    const bytes = await fsClose(5000);
    const ms = performance.now() - t0;

    let verify = "not verified (no USB write in this session)";
    if (fsUsbData && fsUsbData.length == size) {
      let bad = 0;
      for (let i = 0; i < size; i++) if (buf[i] != fsUsbData[i]) bad++;
      verify = bad == 0 ? "verify OK" : "verify " + bad + " bad bytes";
    }
    fsPrint("  " + bytes + "/" + size + " B in " + ms.toFixed(0) + " ms (" + fsRate(bytes, ms) + "), " + verify);
  }));

  function hexToAscii(str) {
    let hex = str.toString();
    let out = '';
    for (let n = 2, c = parseInt(hex.substr(0, 2), 16); (c != 0) && (n <= hex.length); n += 2) {
      out += String.fromCharCode(c);
      c = parseInt(hex.substr(n, 2), 16);
    }
    return out;
  }

  function buf2hex(buffer) {
    return [...new Uint8Array(buffer)]
        .map(x => x.toString(16).padStart(2, '0'))
        .join('');
  }

  navigator.hid.addEventListener("connect", handleConnectedDevice);
  navigator.hid.addEventListener("disconnect", handleDisconnectedDevice);

  term.resize(106, 36);

  term.onData(e => {
    if (connectButton.disabled)
    {
      if (e == '\r')
      {
        sendCommand(cmd);
        cmd = "";
      }
      else cmd += e;
    }
  });
  term.open(document.getElementById('terminal'));

  const windowElement = document.getElementById("desktop-window");
  const headerElement = document.getElementById("window-header");
  const closeBtn = document.getElementById("close-btn");

  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  // Calculate offset when clicking header
  headerElement.addEventListener("mousedown", (e) => {
    isDragging = true;

    // Distance from cursor to top-left corner of the window
    offsetX = e.clientX - windowElement.offsetLeft;
    offsetY = e.clientY - windowElement.offsetTop;

    // Track movement across the entire document
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
  });

  function onMouseMove(e) {
    if (!isDragging) return;

    // Set new top-left coordinates relative to mouse position
    windowElement.style.left = `${e.clientX - offsetX}px`;
    windowElement.style.top = `${e.clientY - offsetY}px`;
  }

  function onMouseUp() {
    isDragging = false;

    // Clean up listeners when drag stops
    document.removeEventListener("mousemove", onMouseMove);
    document.removeEventListener("mouseup", onMouseUp);
  }

  // Close button functionality
  closeBtn.addEventListener("click", () => {
    windowElement.style.display = "none";
    termButton.disabled = false;
  });
</script>

</html>
